      - mcp_fetch_http_server
      - mcp_brave_search_server
      - mcp_tool_negotiation_discovery

tier2_modalities:
  single_turn_direct:
    display_name: "Single-turn direct response"
    description: "Requires only an immediate, stateless answer without invoking tools or multi-step reasoning loops."
  autonomous_agent_loop:
    display_name: "Autonomous multi-turn agent loop"
    description: "Requires iterative plan-execute-inspect cycles with multiple tool calls."
  human_in_the_loop:
    display_name: "Human-in-the-loop verification required"
    description: "High-stakes or irreversible action requiring explicit confirmation from human before proceeding."
  destructive_write:
    display_name: "Destructive / Write-heavy execution"
    description: "Modifies filesystem, git history, database state, cloud resources, or executes shell commands."
  read_only_lookup:
    display_name: "Read-only lookup"
    description: "Accesses external data or files without creating side effects or state modifications."

tier3_complexities:
  atomic:
    display_name: "Atomic"
    description: "Single step, trivial execution, no decomposition required."
  sequential_pipeline:
    display_name: "Sequential Pipeline"
    description: "Step-by-step linear workflow where output of step N feeds into step N+1."
  parallel_map_reduce:
    display_name: "Parallel Map-Reduce"
    description: "Independent concurrent sub-tasks executed in parallel whose results are aggregated."
  diamond_dag:
    display_name: "Diamond DAG"
    description: "Root task branches into parallel workers before converging at an aggregator task."
  dynamic_cyclic:
    display_name: "Dynamic Cyclic"
    description: "Requires iterative trial-and-error feedback loops with branching conditions and verification gates."

tier4_safety_security:
  benign_standard:
    display_name: "Benign standard request"
    description: "Normal, legitimate user request."
  indirect_prompt_injection:
    display_name: "Indirect prompt injection / Jailbreak attempt"
    description: "Attempts to override system instructions, ignore guidelines, or escape sandbox boundaries."
  exfiltration_attempt:
    display_name: "Exfiltration attempt"
    description: "Attempts to steal environment variables, API keys, credentials, or private files."
  destructive_unauthorized:
    display_name: "Destructive unauthorized operation"
    description: "Irreversible actions like dropping database tables, deleting branches, or spending unapproved budget."
  ambiguous_underspecified:
    display_name: "Ambiguous / Underspecified requirement"
    description: "Critical constraints are missing; agent should ask clarifying questions instead of hallucinating assumptions."

granular_categories:
  # Software Engineering
  swe_code_generation:
    domain: software_engineering
    description: "Writing new software code implementations, algorithms, and application logic."
    typical_subagent: coder
  swe_code_refactoring:
    domain: software_engineering
    description: "Restructuring and cleaning up existing code without altering its external behavior."
    typical_subagent: coder
  swe_debugging_bug_hunting:
    domain: software_engineering
    description: "Locating, diagnosing, and fixing runtime errors, logical bugs, and crashes."
    typical_subagent: coder
  swe_devops_ci_cd:
    domain: software_engineering
    description: "Creating and tuning CI/CD pipelines, Dockerfiles, Terraform scripts, and deployment configurations."
    typical_subagent: coder
  swe_system_architecture:
    domain: software_engineering
    description: "High-level software system design, microservices, API schemas, and architectural trade-offs."
    typical_subagent: coder
  swe_test_writing:
    domain: software_engineering
    description: "Writing unit, integration, mock, and property-based test suites."
    typical_subagent: coder
  swe_dependency_management:
    domain: software_engineering
    description: "Resolving package conflicts, lockfiles, upgrading deprecated libraries, and supply-chain auditing."
    typical_subagent: coder
  swe_api_integration:
    domain: software_engineering
    description: "Integrating 3rd party SDKs, webhooks, REST, GraphQL, and gRPC client implementations."
    typical_subagent: coder
  swe_performance_profiling:
    domain: software_engineering
    description: "CPU/memory profiling, flamegraphs, algorithmic time/space optimization, and caching."
    typical_subagent: coder

  # Research & Retrieval
  research_literature_synthesis:
    domain: research_retrieval
    description: "Synthesizing scientific literature, academic papers, state-of-the-art benchmarks, and arXiv publications."
    typical_subagent: researcher
  research_factual_search:
    domain: research_retrieval
    description: "Looking up objective real-world facts, documentation details, release notes, and entity info."
    typical_subagent: researcher
  research_competitive_intelligence:
    domain: research_retrieval
    description: "Analyzing competitor offerings, pricing strategies, market trends, and product comparisons."
    typical_subagent: researcher
  research_data_extraction:
    domain: research_retrieval
    description: "Locating and parsing structured data, tables, or statistics from unstructured documents or websites."
    typical_subagent: researcher
  research_deep_survey:
    domain: research_retrieval
    description: "Conducting comprehensive landscape surveys, taxonomies, and multi-source historical progression analyses."
    typical_subagent: researcher
  research_citation_verification:
    domain: research_retrieval
    description: "Fact-checking claims, verifying attributions, and validating bibliography references."
    typical_subagent: researcher
  research_patent_analysis:
    domain: research_retrieval
    description: "Prior art research, patent claim analysis, technical novelty comparison, and IP landscape mapping."
    typical_subagent: researcher
  research_regulatory_compliance:
    domain: research_retrieval
    description: "Mapping requirements against GDPR, HIPAA, EU AI Act, SOC 2, and ISO certifications."
    typical_subagent: researcher
  research_source_credibility:
    domain: research_retrieval
    description: "Evaluating bias, methodology rigor, author credentials, and reliability of technical sources."
    typical_subagent: researcher

  # Creative Prose
  prose_longform_essay:
    domain: creative_prose
    description: "Drafting longform essays, thought leadership pieces, thought-provoking articles, and speeches."
    typical_subagent: writer
  prose_editing_proofreading:
    domain: creative_prose
    description: "Polishing existing prose, correcting grammar, enhancing flow, rhythm, and clarity."
    typical_subagent: writer
  prose_tone_transfer:
    domain: creative_prose
    description: "Rewriting text to adopt a specific voice, style, persona, or register (e.g., executive, academic, playful)."
    typical_subagent: writer
  prose_copywriting_marketing:
    domain: creative_prose
    description: "Crafting marketing copy, landing pages, email subject lines, product value propositions, and advertisements."
    typical_subagent: writer
  prose_storytelling_narrative:
    domain: creative_prose
    description: "Writing creative fiction, character interactions, dramatic dialogue, and narrative scenes."
    typical_subagent: writer
  prose_email_correspondence:
    domain: creative_prose
    description: "Composing professional emails, stakeholder updates, executive briefing memos, and diplomatic replies."
    typical_subagent: writer
  prose_technical_writing:
    domain: creative_prose
