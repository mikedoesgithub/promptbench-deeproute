  prose_summarization_executive:
    domain: creative_prose
    description: "Distilling voluminous reports, meeting transcripts, and whitepapers into concise executive briefs."
    typical_subagent: writer
  prose_creative_ideation:
    domain: creative_prose
    description: "Brainstorming project names, brand taglines, campaign angles, and metaphorical analogies."
    typical_subagent: writer

  # Mathematical & Symbolic Reasoning
  math_formal_proof:
    domain: math_symbolic
    description: "Constructing rigorous mathematical proofs (direct, induction, contradiction) and theorem derivations."
    typical_subagent: math_specialist
  math_algebra_calculus:
    domain: math_symbolic
    description: "Solving algebraic systems, integrals, differential equations, optimization problems, and matrix equations."
    typical_subagent: math_specialist
  math_probability_statistics:
    domain: math_symbolic
    description: "Computing probabilities, Bayesian updates, hypothesis tests, distributions, and statistical estimations."
    typical_subagent: math_specialist
  math_combinatorics_discrete:
    domain: math_symbolic
    description: "Graph theory algorithms, combinatorial counting, set relations, and discrete mathematics problems."
    typical_subagent: math_specialist
  math_logic_puzzles:
    domain: math_symbolic
    description: "Solving formal logic puzzles, constraint satisfaction problems, and Boolean logic reduction."
    typical_subagent: math_specialist
  math_numerical_computation:
    domain: math_symbolic
    description: "Analyzing floating point roundoff, numerical stability, iterative matrix methods, and numerical root-finding."
    typical_subagent: math_specialist
  math_linear_algebra:
    domain: math_symbolic
    description: "Computing matrix ranks, eigenvalues, singular value decomposition (SVD), and basis projections."
    typical_subagent: math_specialist
  math_optimization_theory:
    domain: math_symbolic
    description: "Formulating linear programs, convex duals, KKT conditions, and gradient descent convergence proofs."
    typical_subagent: math_specialist
  math_information_theory:
    domain: math_symbolic
    description: "Calculating Shannon entropy, Kullback-Leibler divergence, mutual information, and channel capacities."
    typical_subagent: math_specialist

