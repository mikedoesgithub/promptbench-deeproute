[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "promptbench-deeproute"
version = "2.0.0"
description = "A benchmark suite engineered to test fast, low-latency System 1 models on prompt classification, multi-label tagging, and compound prompt decomposition into specialist subagents."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.5.0",
    "pyyaml>=6.0",
    "rich>=13.0.0",
    "networkx>=3.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "scipy>=1.11.0",
    "httpx>=0.25.0",
]

[project.scripts]
promptbench = "run_benchmark:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.setuptools]
py-modules = ["run_benchmark"]
packages = ["src", "src.models", "src.evaluators", "src.harness"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
